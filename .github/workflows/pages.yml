name: Deploy to GitHub Pages

# https://pyw31337.github.io/metro
# 저장소 Settings → Pages → Source 가 "GitHub Actions" 여야 한다.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Require subway proxy URL
        run: test -n "${{ vars.NEXT_PUBLIC_SUBWAY_PROXY_URL }}" || (echo "::warning::NEXT_PUBLIC_SUBWAY_PROXY_URL 미설정 → 공개 프록시 + sample 키로 동작" )

      - name: Build static export (basePath /metro)
        run: npx --no-install next build
        env:
          # NEXT_PUBLIC_DEPLOY_TARGET 을 비워 두면 basePath 가 '/metro' 로 설정된다.
          NEXT_PUBLIC_WC_API_KEY: ${{ secrets.NEXT_PUBLIC_WC_API_KEY }}
          # 서울 실시간 지하철 키는 번들에 넣지 않는다. 전용 Cloudflare Worker(workers/seoul-subway-proxy)가
          # secret 으로 키를 주입하고, 앱은 아래 프록시 주소만 안다. (Worker 장애 시 공개 프록시 + sample 키로 대체)
          NEXT_PUBLIC_SUBWAY_PROXY_URL: ${{ vars.NEXT_PUBLIC_SUBWAY_PROXY_URL }}
          NEXT_PUBLIC_BUS_API_KEY: ${{ secrets.NEXT_PUBLIC_BUS_API_KEY }}
          NEXT_PUBLIC_KAKAO_API_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_API_KEY }}

      - name: Prepare Pages artifact
        run: |
          touch out/.nojekyll
          test -f out/index.html
          test -f out/404.html || cp out/index.html out/404.html
          du -sh out

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
