name: Deploy to Firebase Hosting

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "firebase-deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js (Firebase target)
        run: npx --no-install next build
        env:
          NEXT_PUBLIC_DEPLOY_TARGET: firebase
          NEXT_PUBLIC_WC_API_KEY: ${{ secrets.NEXT_PUBLIC_WC_API_KEY }}
          NEXT_PUBLIC_SEOUL_API_KEY: ${{ secrets.NEXT_PUBLIC_SEOUL_API_KEY }}
          NEXT_PUBLIC_BUS_API_KEY: ${{ secrets.NEXT_PUBLIC_BUS_API_KEY }}
          NEXT_PUBLIC_KAKAO_API_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_API_KEY }}

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project metro-live-2918e --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
