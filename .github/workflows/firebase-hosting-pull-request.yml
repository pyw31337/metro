name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Build
        run: npx --no-install next build
        env:
          NEXT_PUBLIC_DEPLOY_TARGET: firebase
          NEXT_PUBLIC_SEOUL_API_KEY: ${{ secrets.NEXT_PUBLIC_SEOUL_API_KEY }}
          NEXT_PUBLIC_BUS_API_KEY: ${{ secrets.NEXT_PUBLIC_BUS_API_KEY }}
          NEXT_PUBLIC_WC_API_KEY: ${{ secrets.NEXT_PUBLIC_WC_API_KEY }}
          NEXT_PUBLIC_KAKAO_API_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_API_KEY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_METRO_LIVE_2918E }}
          projectId: metro-live-2918e
